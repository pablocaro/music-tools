  <div class="layout">

    <aside class="pocket">
      <!-- The control bar IS the sheet's top edge / handle. Closed, only this row
           peeks at the screen bottom; ⚙ slides the whole sheet up to reveal the grid. -->
      <div class="controlbar">
        <button id="settings-toggle" class="cb-icon" aria-label="Settings">
          <svg class="ic ic-settings"><use href="#ic-settings"/></svg>
        </button>
        <div class="cb-center">
          <button id="from-top" class="cb-icon" aria-label="From the top">
            <svg class="ic ic-restart"><use href="#ic-restart"/></svg>
          </button>
          <button id="play" class="cb-icon" aria-label="Play">
            <svg class="ic ic-play state-rest"><use href="#ic-play"/></svg>
            <svg class="ic ic-pause state-alt"><use href="#ic-pause"/></svg>
          </button>
          <button id="accomp" class="cb-icon" aria-label="Accompaniment on/off">
            <svg class="ic ic-accomp state-off"><use href="#ic-accomp-off"/></svg>
            <svg class="ic ic-accomp state-on"><use href="#ic-accomp-on"/></svg>
          </button>
        </div>

      <div class="pocket-body">

      <!-- Settings read/write these elements; the visible pills, steppers and
           grids above are the UI that drives them. Keeping them as real form
           controls means the preset / session snapshot logic is unchanged. -->
      <div class="state" hidden>
        <input type="range" id="tempo" min="40" max="160" step="1" value="80">
        <input type="checkbox" id="click-on">
        <input type="checkbox" id="play-along">
        <input type="range" id="volume" min="0" max="100" step="5" value="80">
        <input type="checkbox" id="hide-behind">
        <input type="range" id="hide-lead" min="0" max="8" step="1" value="0">
        <input type="checkbox" id="show-chunks">
        <select id="instrument">
          <option value="organ">Organ</option>
          <option value="piano" selected>Piano</option>
          <option value="marimba">Marimba</option>
          <option value="vibraphone">Vibraphone</option>
          <option value="synth">Synth</option>
        </select>
        <select id="cursor-mode">
          <option value="beat" selected>Beat</option>
          <option value="measure">Measure</option>
          <option value="off">Off</option>
        </select>
        <select id="key-tonic">
          <option value="0-0" selected>C</option>
          <option value="1-0">D</option>
          <option value="2-0">E</option>
          <option value="3-0">F</option>
          <option value="4-0">G</option>
          <option value="5-0">A</option>
          <option value="6-0">B</option>
        </select>
        <select id="key-mode">
          <option value="major" selected>Major</option>
          <option value="minor">Minor</option>
          <option value="harmonic">Harmonic Minor</option>
          <option value="melodic">Melodic Minor</option>
        </select>
        <select id="measures">
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="16" selected>16</option>
          <option value="24">24</option>
          <option value="32">32</option>
        </select>
        <select id="clef">
          <option value="treble" selected>Treble</option>
          <option value="alto">Alto</option>
          <option value="tenor">Tenor</option>
          <option value="bass">Bass</option>
        </select>
      </div>

      <!-- PRESETS — snapshots of the whole panel -->
      <div class="band">
        <section class="sec">
          <h2 class="sec-h">Presets</h2>
          <div class="presets" id="presets"></div>
        </section>
      </div>

                <path d="M11.2976 4.89258L11.2976 10.8611L9.74488 9.31003L9.74488 4.89258C9.74488 4.4043 10.0378 4.0918 10.5164 4.0918C11.0046 4.0918 11.2976 4.4043 11.2976 4.89258Z"/>
                <path d="M19.0515 13.9746L2.00074 13.9941L2.92847 12.4805L8.82414 12.4805L10.0183 13.6719L11.1218 12.5586L11.0436 12.4805L18.1238 12.4805Z"/>
                <path d="M10.0183 13.6719L11.1218 12.5586L2.6941 4.14062C2.36207 3.81836 1.93238 3.80859 1.59058 4.14062C1.23902 4.48242 1.25855 4.93164 1.59058 5.26367Z"/>
              </svg>
              <svg class="ic ic-metro state-on" viewBox="0 0 21.3745 18.6621" fill="currentColor" aria-hidden="true">
                <path d="M20.3796 14.541C20.6238 14.9707 20.7605 15.4492 20.7605 15.9082C20.7605 17.4023 19.7546 18.5547 18.0945 18.5547L2.948 18.5547C1.29761 18.5547 0.291753 17.4023 0.291753 15.9082C0.291753 15.4492 0.408941 14.9805 0.672613 14.541L1.05937 13.8672L19.9929 13.8672ZM7.03003 12.5879L1.79364 12.5879L3.70315 9.26101ZM12.8015 1.33789L19.2586 12.5879L13.025 12.5879L11.2878 10.8524L11.2878 4.4043C11.2878 3.91602 10.9949 3.60352 10.5164 3.60352C10.0281 3.60352 9.73511 3.91602 9.73511 4.4043L9.73511 9.30106L5.88689 5.45635L8.25074 1.33789C8.74878 0.449219 9.62769 0 10.5261 0C11.4148 0 12.2937 0.449219 12.8015 1.33789Z"/>
                <path class="rod" d="M9.11011 12.7734L11.2976 12.7539L2.68433 4.14062C2.36207 3.81836 1.93238 3.80859 1.58082 4.14062C1.23902 4.48242 1.25855 4.93164 1.58082 5.26367Z"/>
              </svg>
            </button>
            <button id="cursor-toggle" class="icon-toggle" type="button" aria-label="Cursor on/off">
              <svg class="ic ic-eye state-off"><use href="#ic-eye-off"/></svg>
              <svg class="ic ic-eye state-on"><use href="#ic-eye-on"/></svg>
            </button>
            <div class="stepper">
              <span class="stepper-val" id="tempo-val">80</span>
              <input type="range" class="stepper-range" id="tempo-ui" min="40" max="160" step="1" value="80" aria-label="Tempo">
              <button id="tempo-down" class="step-btn" type="button" aria-label="Slower">&#8722;</button>
              <button id="tempo-up" class="step-btn" type="button" aria-label="Faster">+</button>
            </div>
          </div>
        </section>

        <section class="sec sec-accomp">
          <h2 class="sec-h">Accompaniment</h2>
          <div class="sec-row">
            <button id="instrument-cycle" class="cycle" type="button" aria-label="Voice">Piano</button>
            <div class="stepper stepper-plain">
              <svg class="vol-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <input type="range" class="stepper-range" id="volume-ui" min="0" max="100" step="5" value="80" aria-label="Volume">
            </div>
          </div>
        </section>

        <section class="sec sec-hide">
          <h2 class="sec-h">Hide Ahead</h2>
          <div class="sec-row">
            <div class="stepper">
              <span class="stepper-val" id="hide-val">Off</span>
              <button id="hide-down" class="step-btn" type="button" aria-label="Less">&#8722;</button>
              <button id="hide-up" class="step-btn" type="button" aria-label="More">+</button>
            </div>
            <button id="hide-unit" class="cycle" type="button" aria-label="Hide ahead unit">Beats</button>
          </div>
        </section>
      </div>

      <!-- RHYTHM — the beat figures -->
      <div class="band">
        <section class="sec">
          <h2 class="sec-h">Rhythm</h2>
          <div class="beats" id="beats"></div>
        </section>
      </div>

      <!-- STEP · NOTES — the melodic alphabet and the pitches it may use -->
      <div class="band">
        <section class="sec sec-step">
          <h2 class="sec-h">Step</h2>
          <div class="matrix-head">
            <span></span><span></span>
            <span>up</span>
            <span>down</span>
          </div>
          <div class="matrix" id="matrix"></div>
        </section>

        <section class="sec sec-notes">
          <h2 class="sec-h">Notes</h2>
          <div id="range-grid"></div>
        </section>
      </div>

      <!-- MUSICALITY · CHUNKS -->
      <div class="band">
        <section class="sec sec-musicality">
          <h2 class="sec-h">Musicality</h2>
          <div class="sec-row">
            <input type="range" class="stepper-range bare-range" id="musicality" min="0" max="100" step="5" value="0" aria-label="Musicality">
          </div>
        </section>

        <section class="sec sec-chunks">
          <h2 class="sec-h">Chunks</h2>
          <div class="sec-row">
            <button id="chunks-toggle" class="cycle" type="button" aria-label="Show chunk brackets">Off</button>
            <span class="legend">
              <span class="legend-item"><span class="swatch swatch-scale"></span> steps</span>
              <span class="legend-item"><span class="swatch swatch-chord"></span> leaps</span>
            </span>
          </div>
        </section>
      </div>

      <!-- STAFF, KEY AND LENGTH · MEASURES -->
      <div class="band">
        <section class="sec sec-key">
          <h2 class="sec-h">Staff, Key and Length</h2>
          <div class="sec-row">
            <button id="clef-cycle" class="cycle cycle-clef cycle-glyph" type="button" aria-label="Clef"></button>
            <button id="tonic-cycle" class="cycle" type="button" aria-label="Key">C</button>
            <button id="mode-cycle" class="cycle" type="button" aria-label="Mode">Major</button>
            <button id="acc-cycle" class="cycle cycle-glyph" type="button" aria-label="Accidental">&#9838;</button>
          </div>
        </section>

        <section class="sec sec-measures">
          <h2 class="sec-h">Measures</h2>
          <div class="sec-row" id="measures-pills"></div>
        </section>
      </div>

      <p id="error-msg" class="error" hidden></p>
      </div><!-- /pocket-body -->
    </aside>

    <!-- The music and the control tray share one region, so the tray tracks the
         music whether it's centered (drawer closed/overlaid) or pushed (drawer
         reserving space on a wide window). -->
    <div class="content">
    <header class="topbar">
      <div class="tb-titles">
        <h1 id="sh-title"></h1>
        <div id="sh-sub"></div>
      </div>
      <button id="generate" class="tb-btn" aria-label="New exercise">
        <svg class="ic ic-regenerate"><use href="#ic-regenerate"/></svg>
      </button>
    </header>
    <main class="sheet-area">
      <div id="sheet-stage">
        <div id="sheet"></div>
      </div>
      <div id="cover-top"></div>
      <div id="cover-bot"></div>
      <div id="countdown" hidden></div>
    </main>
    </div><!-- /content -->

    <div class="scrim" id="scrim"></div>

  </div>

  <script src="lib/osme.js"></script>
  <script src="engine.js"></script>
  <script src="samples/instruments.js"></script>
  <script src="app.js"></script>
</body>
</html>
